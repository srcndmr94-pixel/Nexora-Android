name: Restore MainActivity

# Tek seferlik onarim: bozulan MainActivity.kt dosyasini f44cecc9 commit'indeki
# saglam surumden birebir geri koyar. Is bitince bu dosya silinecek.

on:
  push:
    paths:
      - '.github/workflows/restore-mainactivity.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download known-good MainActivity.kt (pinned commit)
        run: |
          set -euo pipefail
          TARGET=app/src/main/java/com/couchsubs/phone/MainActivity.kt
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/f44cecc91ba3b35e3d293521a3ec2df3c1b5222d/${TARGET}"
          curl -sSfL "$URL" -o /tmp/ma_good.kt
          echo "downloaded: $(wc -c < /tmp/ma_good.kt) bytes"
          echo "sha256: $(sha256sum /tmp/ma_good.kt | cut -d' ' -f1)"
          test "$(wc -c < /tmp/ma_good.kt)" -gt 50000
          head -1 /tmp/ma_good.kt | grep -qx 'package com.couchsubs.phone'
          cp /tmp/ma_good.kt "$TARGET"
          echo "target now: $(wc -c < "$TARGET") bytes"

      - name: Commit and push the restored file
        run: |
          set -euo pipefail
          TARGET=app/src/main/java/com/couchsubs/phone/MainActivity.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo 'nothing to restore'
            exit 0
          fi
          git commit -m 'fix(build): restore MainActivity.kt from f44cecc9' -m 'The file was overwritten with a shell command in 15c6607, which broke compileDebugKotlin. Restored the last known-good version.'
          git push
