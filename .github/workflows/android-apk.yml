name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Android debug keystore (stable signature for updates)
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: nexora-android-debug-keystore-v1
      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create debug-latest app/build/outputs/apk/debug/app-debug.apk \
            --title "GameLingoPro debug-latest" \
            --notes "Otomatik oluşturulan debug APK (her derlemede güncellenir)." \
            --target "${{ github.sha }}" \
            --prerelease \
            || gh release upload debug-latest app/build/outputs/apk/debug/app-debug.apk --clobber
          gh release edit debug-latest \
            --title "GameLingoPro debug-latest" \
            --notes "Otomatik oluşturulan debug APK (her derlemede güncellenir)." \
            --target "${{ github.sha }}" \
            --prerelease
