name: Fix OCR region binding
on:
  push:
    paths:
      - '.github/workflows/fix-ocr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        env:
          PATCH_B64: ""
        run: |
          set -e
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch_ocr.py
          sha256sum /tmp/patch_ocr.py
          python3 /tmp/patch_ocr.py
          git diff --stat
      - name: Commit and push
        run: |
          set -e
          git config user.name "nexora-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/src/main/java/com/couchsubs/phone/ScreenCaptureService.kt app/src/main/java/com/couchsubs/phone/MainActivity.kt
          if git diff --cached --quiet; then echo "degisiklik yok"; exit 0; fi
          git commit -m "fix: altyazi bolgesini ayara bagla, kendi cevirisini tekrar okumayi engelle"
          git push
