name: Fix dialog crash
on:
  push:
    paths:
      - '.github/workflows/fix-dialog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch AlertDialog import
        run: |
          set -e
          F=app/src/main/java/com/couchsubs/phone/MainActivity.kt
          sed -i 's|import androidx\.appcompat\.app\.AlertDialog|import android.app.AlertDialog|' "$F"
          echo "kalan appcompat satiri: $(grep -c 'androidx\.appcompat' "$F" || true)"
          grep -n 'import android.app.AlertDialog' "$F"
          wc -c "$F"
      - name: Commit and push
        run: |
          set -e
          git config user.name "nexora-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "degisiklik yok"; exit 0; fi
          git commit -m "fix: framework AlertDialog kullan (Theme.Material ile uyumlu)"
          git push
